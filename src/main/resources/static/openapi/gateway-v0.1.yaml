openapi: 3.1.0
info:
  title: Green AI API Gateway
  version: 0.1.0
  description: Superficie externa confirmada para Monitoring y Data Processing. Se conservan los contratos funcionales upstream.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/monitoring/v1/metrics/catalog:
    get:
      operationId: getMetricCatalog
      summary: Obtiene el catálogo de métricas permitido
      responses:
        '200':
          description: Catálogo definido por Monitoring v0.1
        '502':
          $ref: '#/components/responses/GatewayFailure'
        '503':
          $ref: '#/components/responses/GatewayFailure'
        '504':
          $ref: '#/components/responses/GatewayFailure'
  /api/monitoring/v1/metrics/current:
    get:
      operationId: getCurrentMetrics
      summary: Consulta métricas actuales normalizadas
      parameters:
        - $ref: '#/components/parameters/metric'
        - $ref: '#/components/parameters/resourceType'
        - $ref: '#/components/parameters/cluster'
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: MetricsResponse definido por Monitoring v0.1
        '400':
          $ref: '#/components/responses/UpstreamProblem'
        '422':
          $ref: '#/components/responses/UpstreamProblem'
        '502':
          $ref: '#/components/responses/GatewayFailure'
        '503':
          $ref: '#/components/responses/GatewayFailure'
        '504':
          $ref: '#/components/responses/GatewayFailure'
  /api/monitoring/v1/metrics/history:
    get:
      operationId: getMetricHistory
      summary: Consulta métricas históricas normalizadas
      parameters:
        - $ref: '#/components/parameters/metric'
        - $ref: '#/components/parameters/resourceType'
        - $ref: '#/components/parameters/cluster'
        - $ref: '#/components/parameters/resourceId'
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: stepSeconds
          in: query
          schema: {type: integer, minimum: 15, maximum: 3600, default: 15}
      responses:
        '200':
          description: MetricsResponse definido por Monitoring v0.1
        '400':
          $ref: '#/components/responses/UpstreamProblem'
        '422':
          $ref: '#/components/responses/UpstreamProblem'
        '502':
          $ref: '#/components/responses/GatewayFailure'
        '503':
          $ref: '#/components/responses/GatewayFailure'
        '504':
          $ref: '#/components/responses/GatewayFailure'
  /api/processing/v1/metrics/history:
    get:
      operationId: getProcessedMetricHistory
      summary: Consulta historial de métricas procesado
      description: Conserva contrato y validación de Data Processing v1.
      parameters:
        - $ref: '#/components/parameters/metric'
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/resourceType'
        - $ref: '#/components/parameters/cluster'
        - $ref: '#/components/parameters/resourceId'
        - name: stepSeconds
          in: query
          schema: {type: integer, minimum: 15, maximum: 3600, default: 15}
      responses:
        '200': {description: ProcessedHistory de Data Processing v1}
        '422': {$ref: '#/components/responses/UpstreamProblem'}
        '500': {$ref: '#/components/responses/UpstreamProblem'}
        '502': {$ref: '#/components/responses/UpstreamProblem'}
        '503': {$ref: '#/components/responses/UpstreamProblem'}
        '504': {$ref: '#/components/responses/GatewayFailure'}
  /api/processing/v1/historical-logs:
    get:
      operationId: getHistoricalLogs
      summary: Consulta logs históricos paginados
      parameters:
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: hardwareId
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 20}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
      responses:
        '200': {description: HistoricalPage de Data Processing v1}
        '422': {$ref: '#/components/responses/UpstreamProblem'}
        '500': {$ref: '#/components/responses/UpstreamProblem'}
        '502': {$ref: '#/components/responses/UpstreamProblem'}
        '503': {$ref: '#/components/responses/UpstreamProblem'}
        '504': {$ref: '#/components/responses/GatewayFailure'}
  /api/processing/v1/prediction/dataset:
    get:
      operationId: getPredictionDataset
      summary: Prepara un dataset para predicción
      description: Contrato provisional; prepara datos y no ejecuta inferencia.
      parameters:
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: cluster
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        - name: resourceId
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        - name: stepSeconds
          in: query
          schema: {type: integer, minimum: 15, maximum: 3600, default: 15}
      responses:
        '200': {description: PredictionDataset de Data Processing v1}
        '422': {$ref: '#/components/responses/UpstreamProblem'}
        '500': {$ref: '#/components/responses/UpstreamProblem'}
        '502': {$ref: '#/components/responses/UpstreamProblem'}
        '503': {$ref: '#/components/responses/UpstreamProblem'}
        '504': {$ref: '#/components/responses/GatewayFailure'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de Supabase Auth con user_role OPERATOR o ADMIN. Ausente/inválido devuelve 401; rol insuficiente, 403.
  parameters:
    metric:
      name: metric
      in: query
      required: true
      schema:
        type: string
        enum: [node.cpu.utilization, node.memory.used, node.network.receive, node.network.transmit, node.filesystem.used]
    resourceType:
      name: resourceType
      in: query
      schema: {type: string, const: node, default: node}
    cluster:
      name: cluster
      in: query
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
    resourceId:
      name: resourceId
      in: query
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
  responses:
    UpstreamProblem:
      description: application/problem+json conservado desde el servicio upstream
    GatewayFailure:
      description: Fallo del servicio upstream o de comunicación, sin detalles internos
